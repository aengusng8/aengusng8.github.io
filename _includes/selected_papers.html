          <div class="publications" id="selected-publications">
            <h2>selected publications</h2>
            <div class="publications__note">(*) denotes equal contribution</div>
            {% bibliography -f papers -q @*[selected=true]* --sort_by selected_order --order ascending %}
          </div>
          <dialog class="paper-talk-player" aria-labelledby="paper-talk-title">
            <header>
              <h3 id="paper-talk-title">Paper talk</h3>
              <form method="dialog"><button type="submit" aria-label="Close video">Close</button></form>
            </header>
            <video controls playsinline preload="none" aria-labelledby="paper-talk-title"></video>
          </dialog>
          <script defer src="{{ '/assets/js/paper-talks.js' | relative_url }}"></script>
